    }
    document.getElementById("mcount").textContent = month + "월 · " + n + "건" + (TK.length ? " (검색 " + hit + "건)" : "");
    var cnt = monthCounts(), tabs = document.querySelectorAll("#mtabs button");
    for (var t = 0; t < tabs.length; t++) {
      var b = tabs[t], m = t + 1;
      b.classList.toggle("on", m === month);
      b.classList.toggle("zero", TK.length > 0 && cnt[m] === 0);
      var old = b.querySelector(".bd"); if (old) b.removeChild(old);
      if (TK.length && cnt[m]) { var s = document.createElement("span"); s.className = "bd"; s.textContent = cnt[m]; b.appendChild(s); }
    }
  }
  function flip(dir) { host.classList.remove("flip-next", "flip-prev"); void host.offsetWidth; host.classList.add(dir > 0 ? "flip-next" : "flip-prev"); }
  function go(dm) { month = ((month - 1 + dm + 12) % 12) + 1; render(); flip(dm); }
  function jump(m) { if (m === month) return; var dir = m > month ? 1 : -1; month = m; render(); flip(dir); }

  var tabsEl = document.getElementById("mtabs");
  for (var m = 1; m <= 12; m++) (function (m) {
    var b = document.createElement("button"); b.type = "button"; b.textContent = m + "월";
    b.addEventListener("click", function () { jump(m); }); tabsEl.appendChild(b);
  })(m);
  document.getElementById("pm").addEventListener("click", function () { go(-1); });
  document.getElementById("nm").addEventListener("click", function () { go(1); });
  document.getElementById("tod").addEventListener("click", function () { jump(TM); });

  var box = document.querySelector(".cal"), x0 = 0, y0 = 0, on = false;
  box.addEventListener("touchstart", function (e) { if (e.touches.length !== 1) { on = false; return; } on = true; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  box.addEventListener("touchend", function (e) {
    if (!on) return; on = false;
    var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (window.visualViewport && window.visualViewport.scale > 1.02) return;      // 확대 중에는 넘기지 않고 화면 이동만
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
  }, { passive: true });

  /* ---------- 검색 입력 ---------- */
  var q = document.getElementById("q"), cnt = document.getElementById("cnt");
  function onSearch(jumpToHit) {
    TK = tokens(q.value);
    var c = monthCounts();
    if (jumpToHit && TK.length && c[month] === 0) {
      for (var k = 1; k <= 12; k++) { var m2 = ((month - 1 + k) % 12) + 1; if (c[m2]) { month = m2; break; } }
    }
    render();
    if (!TK.length) { cnt.textContent = "전체 " + EV.length + "건"; return; }
    var inCal = 0; for (var m = 1; m <= 12; m++) inCal += c[m];
    cnt.textContent = "검색 결과 " + inCal + "건";
  }
  q.addEventListener("input", function () { onSearch(true); });
  onSearch(false);
})();
</script>
</body>
</html>
