<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Archive — Kim Sang Yuk</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  :root { --text:#0B1220; --muted:#6B7290; --soft:#8A90A8; --border:#D7DCEE; --line:#E7EAF4; --blue:#2F5FE0; --purple:#6D4FE0; --hover:#EEF1FA; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:linear-gradient(180deg,#EEF1FA 0%,#E7EBF7 100%); font-family:'Inter','Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:var(--text); }
  .wrap { max-width:1180px; margin:0 auto; padding:56px 32px 90px; }
  .back-link { display:inline-flex; align-items:center; gap:6px; text-decoration:none; color:#4A5170; font-size:13px; font-weight:600; margin-bottom:40px; transition:color .15s ease; }
  .back-link:hover { color:var(--blue); }
  .eyebrow { font-weight:700; font-size:13px; letter-spacing:.14em; margin:0 0 34px; }
  .eyebrow .blue { color:var(--blue); }
  h1 { font-size:clamp(40px,6vw,72px); line-height:1; margin:0 0 56px; font-weight:900; letter-spacing:-0.03em; }
  section { margin-top:60px; padding-top:44px; border-top:1px solid var(--border); }
  section:first-of-type { margin-top:0; }
  a { color:inherit; }
  a:focus-visible, button:focus-visible { outline:2px solid var(--blue); outline-offset:2px; border-radius:8px; }
  .item { display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:10px 6px; border-radius:8px; border-left:2px solid transparent; border-bottom:1px solid var(--line); text-decoration:none; color:var(--text); transition:background .15s ease, padding-left .15s ease, border-color .15s ease; }
  a.item:hover { background:var(--hover); padding-left:12px; border-color:#C7CDE3; }
  .t { font-size:13px; font-weight:700; }
  .sm { font-size:12px; color:var(--purple); font-weight:600; white-space:nowrap; flex-shrink:0; }
  .tcol { display:flex; flex-direction:column; gap:3px; }
  .sum { font-size:12.5px; font-weight:400; color:var(--muted); }
  .digest .item { padding:12px 6px; }
  .cols2 { display:grid; grid-template-columns:1fr 1fr; column-gap:56px; }
  .cols2 .item { padding:8px 6px; }
  .cols3 { display:grid; grid-template-columns:1fr 1fr 1fr; column-gap:40px; row-gap:4px; }
  .cols3 .item { display:block; padding:8px 6px; }
  .gal { display:flex; flex-direction:column; align-items:center; gap:14px; }
  .grow { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; }
  .thumb { padding:0; border:none; background:none; cursor:pointer; border-radius:12px; overflow:hidden; line-height:0; transition:transform .15s ease, box-shadow .15s ease; }
  .thumb:hover { transform:translateY(-3px); box-shadow:0 10px 22px rgba(20,30,70,.22); }
  .thumb img { width:104px; height:104px; object-fit:cover; display:block; border-radius:12px; box-shadow:0 4px 14px rgba(20,30,70,.16); }
  .iacard { display:flex; align-items:center; justify-content:space-between; background:#fff; border-radius:16px; padding:22px 26px; text-decoration:none; box-shadow:0 12px 30px rgba(20,30,70,.10); transition:transform .15s ease, box-shadow .15s ease; }
  .iacard:hover { transform:translateY(-2px); box-shadow:0 18px 40px rgba(20,30,70,.16); }
  .iacard .ey { font-weight:700; font-size:13px; letter-spacing:.14em; }
  .iacard .ey .blue { color:var(--blue); }
  .iacard .ar { font-size:18px; color:var(--blue); font-weight:700; }
  #lb { position:fixed; inset:0; z-index:100; background:rgba(11,18,32,.86); display:none; align-items:center; justify-content:center; padding:24px; }
  #lb.on { display:flex; }
  #lb img { max-width:92vw; max-height:88vh; object-fit:contain; border-radius:8px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  #lbx { position:fixed; top:20px; right:20px; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.12); border:none; color:#fff; font-size:22px; cursor:pointer; }
  @media (max-width:880px) {
    .wrap { padding:36px 16px 70px; }
    .cols2, .cols3 { grid-template-columns:1fr; }
    .thumb img { width:84px; height:84px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="/">&larr; KIM SANG YUK</a>
  <h1>My Archive</h1>

  <section id="report"><p class="eyebrow">REPORT <span>&amp;</span> <span class="blue">PAPER</span></p><div id="report-list"></div></section>
  <section id="gallery"><p class="eyebrow">GOODS <span>&amp;</span> <span class="blue">GALLERY</span></p><div class="gal" id="gal-rows"></div></section>
  <section id="digest"><p class="eyebrow">ULSAN <span>&mdash;</span> <span class="blue">DIGEST</span></p><div class="digest" id="digest-list"></div></section>
  <section id="archive"><p class="eyebrow">U-HISTORY <span>&mdash;</span> <span class="blue">ARCHIVE</span></p><div class="cols2" id="archive-list"></div></section>
  <section id="curator"><p class="eyebrow">U-HISTORIAN <span>&amp;</span> <span class="blue">CURATOR</span></p><div class="cols3" id="curator-list"></div></section>
  <section id="internet"><a class="iacard" href="/archive.html"><span class="ey">INTERNET <span>&mdash;</span> <span class="blue">ARCHIVE</span></span><span class="ar">&rarr;</span></a></section>
</div>

<div id="lb" role="dialog" aria-modal="true" aria-label="이미지 보기"><button id="lbx" type="button" aria-label="닫기">&times;</button><img id="lbimg" alt="" /></div>

<script>
/* 데이터는 메인 페이지(App.jsx)에 있던 목록을 그대로 옮긴 것입니다.
   PDF는 /pdfs/, 사진은 /gallery/ 폴더(public/ 아래)를 가리킵니다. */
const DIGEST = [
  {
    title: "일학헌중수상량문",
    author: "유한위",
    year: "1784",
    summary: "",
    file: "/pdfs/house.pdf",
  },
  {
    title: "서지하화기",
    author: "심원열",
    year: "1855",
    summary: "",
    file: "/pdfs/westpond.pdf",
  },
  {
    title: "내 고향의 자랑, 울산풍물(蔚山風物)",
    author: "최현배",
    year: "1941",
    summary: "",
    file: "/pdfs/pride.pdf",
  },
  {
    title: "울산공업센터 기공식 치사문",
    author: "박정희",
    year: "1962",
    summary: "",
    file: "/pdfs/industry.pdf",
  },
  {
    title: "한반도연해포경사 서문",
    author: "박구병",
    year: "1987",
    summary: "",
    file: "/pdfs/whalesea.pdf",
  },
  {
    title: "울산역사연표",
    author: "pyarcher",
    year: "2026",
    summary: "",
    file: "/pdfs/chronology.pdf",
  },
  {
    title: "경상좌병영지도 이야기",
    author: "pyarcher",
    year: "2026",
    summary: "",
    file: "/pdfs/campleft.pdf",
  },
  {
    title: "경상좌병영 동문(인빈문) 이야기",
    author: "pyarcher",
    year: "2026",
    summary: "",
    file: "/pdfs/eastgate.pdf",
  },
];
const REPORTS = [
  { title: "Lessons from Onondaga Lake Remediation, 2003", file: "/pdfs/lake.pdf" },
  { title: "The Strike of the Korean Cargo Workers Federation in 2003, 2003", file: "/pdfs/cargo.pdf" },
  { title: "고래와 고래잡이, 그리고 고래특구, 2012", file: "/pdfs/ulsanwhaling.pdf" },
  { title: "대학생 촌관제와 후루사토 워킹홀리데이 연구, 2017", file: "/pdfs/work.pdf" },
  { title: "미국 캘리포니아 고래관광 및 말산업 연구, 2023", file: "/pdfs/horse.pdf" },
];
const GALLERY = [
  { group: 8, files: ["81bibyunsa", "82haedong"] },
  { group: 7, files: ["72dasannampo", "73yosandai"] },
  { group: 6, files: ["61mugcup", "62lotus", "63birdpole"] },
  { group: 5, files: ["51seaside", "52bamboo"] },
  { group: 4, files: ["41windycliff", "42sunrising", "43twinrock"] },
  { group: 3, files: ["31tongdosa", "33virchow"] },
  { group: 1, files: ["11epitaph2", "12epitaph"] },
];
const ARCHIVE = [
  { title: "송호유집(류정)", org: "한국국학진흥원" },
  { title: "부북일기(박계숙/박취문)", org: "다빈치맵" },
  { title: "청대일기(권상일)", org: "한국국학진흥원" },
  { title: "함안군총쇄록(오횡묵)", org: "한국학중앙연구원" },
  { title: "심원권일기(심원권)", org: "국사편찬위원회" },
  { title: "울산부호적", org: "규장각" },
  { title: "통합울산지리지", org: "울산문화원연합회" },
  { title: "통합울산선생안", org: "울산연구원" },
  { title: "울산고지도", org: "규장각" },
  { title: "군세일반", org: "국사편찬위원회" },
  { title: "오만분일지형도", org: "국사편찬위원회" },
  { title: "울산공업센터", org: "한국정책방송원" },
  { title: "울산광역시사", org: "울산광역시" },
  { title: "행정구역명칭변천사", org: "울산연구원" },
];
const CURATOR = [
  { title: "울산연구원 / 울산역사연구소", url: "https://www.uri.re.kr/" },
  { title: "울산박물관", url: "https://www.ulsan.go.kr/s/museum/" },
  { title: "장생포고래박물관", url: "https://www.whalecity.kr/" },
  { title: "울산문화유산연구원", url: "http://www.usmy.or.kr/" },
  { title: "울산문화원연합회", url: "https://www.kccf.or.kr/" },
  { title: "울주문화원", url: "http://m.ulju.or.kr/" },
  { title: "울산대학교 / 역사문화학과", url: "https://history.ulsan.ac.kr/history/" },
  { title: "울산노동역사관", url: "https://www.nodong1987.org/" },
  { title: "국립경주박물관", url: "https://gyeongju.museum.go.kr/" },
  { title: "국립김해박물관", url: "https://gimhae.museum.go.kr/" },
  { title: "국립진주박물관", url: "https://jinju.museum.go.kr/" },
  { title: "부산대학교 박물관", url: "https://pnumuseum.pusan.ac.kr/pnumuseum/" },
  { title: "동국대학교 박물관", url: "https://dgumuseum.dongguk.edu/" },
  { title: "부산박물관", url: "https://museum.busan.go.kr/busan/" },
  { title: "양산박물관", url: "https://www.yangsan.go.kr/museum/" },
];

(function () {
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function link(cls, href) { var a = el("a", cls); a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer"; return a; }

  var rl = document.getElementById("report-list");
  REPORTS.forEach(function (d) { var a = link("item", d.file); a.appendChild(el("span", "t", d.title)); rl.appendChild(a); });

  var dl = document.getElementById("digest-list");
  DIGEST.forEach(function (d) {
    var a = link("item", d.file), c = el("div", "tcol");
    c.appendChild(el("span", "t", d.title));
    if (d.summary) c.appendChild(el("span", "sum", d.summary));
    a.appendChild(c); a.appendChild(el("span", "sm", d.author + " \u00b7 " + d.year)); dl.appendChild(a);
  });

  var al = document.getElementById("archive-list");
  ARCHIVE.forEach(function (d) {
    var a = d.url ? link("item", d.url) : el("div", "item");
    a.appendChild(el("span", "t", d.title)); a.appendChild(el("span", "sm", d.org)); al.appendChild(a);
  });

  var cl = document.getElementById("curator-list");
  CURATOR.forEach(function (d) { var a = link("item", d.url); a.appendChild(el("span", "t", d.title)); cl.appendChild(a); });

  var lb = document.getElementById("lb"), lbimg = document.getElementById("lbimg"), lastBtn = null;
  function openLb(src, btn) { lastBtn = btn; lbimg.src = src; lb.classList.add("on"); document.getElementById("lbx").focus(); }
  function closeLb() { lb.classList.remove("on"); lbimg.removeAttribute("src"); if (lastBtn) lastBtn.focus(); }
  var gr = document.getElementById("gal-rows");
  GALLERY.forEach(function (row) {
    var r = el("div", "grow");
    row.files.forEach(function (name) {
      var b = el("button", "thumb"); b.type = "button"; b.setAttribute("aria-label", "Open " + name);
      var im = el("img"); im.src = "/gallery/" + name + ".jpg"; im.alt = name; im.loading = "lazy"; b.appendChild(im);
      b.addEventListener("click", function () { openLb("/gallery/" + name + ".jpg", b); });
      r.appendChild(b);
    });
    gr.appendChild(r);
  });
  lb.addEventListener("click", closeLb);
  lbimg.addEventListener("click", function (e) { e.stopPropagation(); });
  document.getElementById("lbx").addEventListener("click", function (e) { e.stopPropagation(); closeLb(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && lb.classList.contains("on")) closeLb(); });
})();
</script>
</body>
</html>
