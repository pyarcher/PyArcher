<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>울산 기관·기업 창립기념일 — Kim Sang Yuk</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  :root { --text:#0B1220; --muted:#6B7290; --soft:#8A90A8; --border:#D7DCEE; --line:#E7EAF4; --blue:#2F5FE0; --purple:#6D4FE0; --green:#2F7A4F; --hover:#EEF1FA; --th:#F3F5FC; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:linear-gradient(180deg,#EEF1FA 0%,#E7EBF7 100%); font-family:'Inter','Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:var(--text); }
  .wrap { max-width:1000px; margin:0 auto; padding:56px 32px 110px; }
  .back-link { display:inline-flex; align-items:center; gap:6px; text-decoration:none; color:#4A5170; font-size:13px; font-weight:600; margin-bottom:40px; transition:color .15s ease; }
  .back-link:hover { color:var(--blue); }
  .eyebrow { font-weight:700; font-size:13px; letter-spacing:.14em; margin:0 0 12px; }
  .eyebrow .blue { color:var(--blue); }
  h1 { font-size:34px; line-height:1.2; margin:0 0 6px; font-weight:800; letter-spacing:-0.02em; }
  .subtitle { font-size:15px; color:var(--muted); margin:0 0 24px; line-height:1.6; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline:2px solid var(--blue); outline-offset:2px; border-radius:6px; }

  .searchbar { position:sticky; top:0; z-index:5; padding:10px 0 12px; background:linear-gradient(180deg,#EEF1FA 75%,rgba(238,241,250,0)); }
  .sbox { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--border); border-radius:14px; padding:4px 6px 4px 14px; box-shadow:0 8px 22px rgba(20,30,70,.08); }
  .sbox input { flex:1; min-width:0; border:0; outline:none; font:inherit; font-size:15px; padding:10px 0; background:transparent; color:var(--text); }
  .sbox .cnt { font-size:12.5px; font-weight:700; color:var(--purple); white-space:nowrap; }
  .sbox button { border:0; background:var(--hover); color:#3b4260; font:inherit; font-size:12.5px; font-weight:700; padding:8px 12px; border-radius:10px; cursor:pointer; }

  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 4px; }
  .tab { border:1px solid var(--border); background:#fff; color:#27407f; font:inherit; font-size:13px; font-weight:700; padding:7px 12px; border-radius:999px; cursor:pointer; transition:background .15s ease; }
  .tab small { color:var(--soft); font-weight:600; margin-left:4px; }
  .tab:hover { background:var(--hover); }
  .tab[aria-pressed="true"] { background:var(--blue); border-color:var(--blue); color:#fff; }
  .tab[aria-pressed="true"] small { color:#dfe6ff; }

  .next { margin:18px 0 0; background:#fff; border-radius:16px; box-shadow:0 12px 30px rgba(20,30,70,.08); padding:14px 20px; font-size:14px; line-height:1.7; }
  .next b { color:var(--green); }
  .sec-head { display:flex; align-items:baseline; gap:12px; margin:30px 0 10px; }
  .sec-name { font-weight:800; font-size:15px; color:var(--purple); letter-spacing:.02em; }
  .sec-line { flex:1; height:1px; background:var(--border); }
  .sec-cnt { font-size:12px; font-weight:700; color:var(--soft); }
  .card { background:#fff; border-radius:16px; box-shadow:0 12px 30px rgba(20,30,70,.08); padding:4px 20px; }
  .r { display:grid; grid-template-columns:96px minmax(0,1fr) auto; gap:2px 14px; align-items:baseline; padding:11px 2px; border-top:1px solid var(--line); }
  .r:first-child { border-top:0; }
  .r.today { background:#F1FAF3; border-radius:10px; }
  .dt { font-weight:800; color:var(--green); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .nm { font-size:14.5px; font-weight:700; }
  .nm .cat { font-size:11.5px; font-weight:700; color:#27407f; background:var(--th); border-radius:6px; padding:1px 7px; margin-left:6px; white-space:nowrap; }
  .yr { font-size:12.5px; color:var(--muted); white-space:nowrap; text-align:right; }
  .memo { grid-column:2 / 4; font-size:12.5px; color:var(--muted); line-height:1.6; }
  mark { background:#FFE58A; color:inherit; border-radius:3px; padding:0 1px; }
  .empty { padding:40px 0; text-align:center; color:var(--muted); }
  .note { font-size:12.5px; color:var(--muted); line-height:1.7; margin:30px 0 0; }
  @media (max-width:640px) {
    .wrap { padding:36px 16px 100px; }
    h1 { font-size:26px; }
    .card { padding:2px 12px; }
    .r { grid-template-columns:1fr; }
    .yr { grid-column:1; text-align:left; }
    .memo { grid-column:1; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="/calendar.html">&larr; CALENDAR</a>
  <p class="eyebrow">ULSAN <span>&mdash;</span> <span class="blue">CORPORATE ANNIVERSARY</span></p>
  <h1>울산 기관·기업 창립기념일</h1>
  <p class="subtitle" id="sub"></p>

  <div class="searchbar">
    <div class="sbox">
      <input id="q" type="search" placeholder="이름·분류·월·연도 검색 (예: 현대, 병원, 3월, 1974)" aria-label="창립기념일 검색" autocomplete="off" />
      <span class="cnt" id="cnt" aria-live="polite"></span>
      <button type="button" id="clr">지우기</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="분류 선택"></nav>
  <div class="next" id="next"></div>
  <div id="list"></div>
  <p class="note" id="note"></p>
</div>

<script src="corporate-data.js"></script>
<script>
(function () {
  var D = window.CORP;
  if (!D) { document.getElementById("list").textContent = "데이터 파일(corporate-data.js)을 불러오지 못했습니다."; return; }
  var R = D.rows;
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  var DOW = ["일", "월", "화", "수", "목", "금", "토"];
  var now = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date()).split("-").map(Number);
  var TY = now[0], TM = now[1], TD = now[2];

  document.getElementById("sub").textContent = "공공기관·기업·병원·대학·은행·특별법인 " + R.length + "곳의 창립·개원·개교기념일";
  document.getElementById("note").textContent = D.note || "";

  /* 분류 탭 */
  var cats = [], cnt = {};
  R.forEach(function (r) { if (!(r.cat in cnt)) { cats.push(r.cat); cnt[r.cat] = 0; } cnt[r.cat]++; });
  var ORDER = ["공공기관", "기업", "병원", "대학교", "은행·금융", "특별법인"];
  cats.sort(function (a, b) { var x = ORDER.indexOf(a), y = ORDER.indexOf(b); return (x < 0 ? 99 : x) - (y < 0 ? 99 : y); });
  var cur = "";
  var tabs = document.getElementById("tabs"), btns = [];
  [""].concat(cats).forEach(function (c) {
    var b = el("button", "tab"); b.type = "button";
    b.appendChild(document.createTextNode(c || "전체")); b.appendChild(el("small", null, String(c ? cnt[c] : R.length)));
    b.addEventListener("click", function () { cur = c; render(); });
    b._c = c; tabs.appendChild(b); btns.push(b);
  });

  /* 다가오는 창립기념일 */
  function daysTo(r) {
    var t = Date.UTC(TY, TM - 1, TD), y = TY, x = Date.UTC(y, r.m - 1, r.d);
    if (x < t) x = Date.UTC(y + 1, r.m - 1, r.d);
    return Math.round((x - t) / 86400000);
  }
  (function () {
    var box = document.getElementById("next");
    var sorted = R.slice().sort(function (a, b) { return daysTo(a) - daysTo(b); });
    var min = daysTo(sorted[0]);
    var soon = sorted.filter(function (r) { return daysTo(r) <= Math.max(min, 14); }).slice(0, 6);
    box.appendChild(el("b", null, "다가오는 창립기념일 "));
    box.appendChild(document.createTextNode(soon.map(function (r) {
      var n = daysTo(r); return r.m + "/" + r.d + " " + r.s + " (" + (n === 0 ? "오늘" : "D-" + n) + ", " + (TY - (+r.y) + (r.m < TM || (r.m === TM && r.d < TD) ? 1 : 0)) + "주년)";
    }).join(" · ")));
  })();

  var TK = [];
  function hl(parent, text) {
    text = String(text == null ? "" : text);
    if (!TK.length || !text) { parent.appendChild(document.createTextNode(text)); return; }
    var low = text.toLowerCase(), pos = 0;
    while (pos < text.length) {
      var best = -1, len = 0;
      TK.forEach(function (t) { var k = low.indexOf(t, pos); if (k >= 0 && (best < 0 || k < best)) { best = k; len = t.length; } });
      if (best < 0) { parent.appendChild(document.createTextNode(text.slice(pos))); break; }
      if (best > pos) parent.appendChild(document.createTextNode(text.slice(pos, best)));
      parent.appendChild(el("mark", null, text.slice(best, best + len)));
      pos = best + len;
    }
  }
  function hay(r) { return [r.m + "월", r.m + "월 " + r.d + "일", r.n, r.cat, r.sub, r.y, r.y + "년", r.memo].join(" ").toLowerCase(); }

  var list = document.getElementById("list"), q = document.getElementById("q"), cntEl = document.getElementById("cnt");
  function render() {
    TK = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    btns.forEach(function (b) { b.setAttribute("aria-pressed", b._c === cur ? "true" : "false"); });
    var rows = R.filter(function (r) { return (!cur || r.cat === cur) && TK.every(function (t) { return hay(r).indexOf(t) >= 0; }); });
    cntEl.textContent = (TK.length || cur ? "결과 " : "전체 ") + rows.length + "곳";
    list.textContent = "";
    if (!rows.length) { list.appendChild(el("p", "empty", "찾는 내용이 없습니다.")); return; }
    for (var m = 1; m <= 12; m++) {
      var part = rows.filter(function (r) { return r.m === m; });
      if (!part.length) continue;
      var hd = el("div", "sec-head"); hd.appendChild(el("span", "sec-name", m + "월")); hd.appendChild(el("span", "sec-line")); hd.appendChild(el("span", "sec-cnt", part.length + "곳"));
      list.appendChild(hd);
      var card = el("div", "card");
      part.forEach(function (r) {
        var row = el("div", "r" + (r.m === TM && r.d === TD ? " today" : ""));
        var dw = DOW[new Date(Date.UTC(TY, r.m - 1, r.d)).getUTCDay()];
        var dt = el("span", "dt"); hl(dt, r.m + "월 " + r.d + "일"); dt.appendChild(el("small", null, "(" + dw + ")")); row.appendChild(dt);
        var nm = el("span", "nm"); hl(nm, r.n); var c = el("span", "cat"); hl(c, r.sub || r.cat); nm.appendChild(c); row.appendChild(nm);
        var yr = el("span", "yr"); hl(yr, r.y + "년"); yr.appendChild(document.createTextNode(" · " + (TY - (+r.y)) + "주년")); row.appendChild(yr);
        if (r.memo) { var me = el("span", "memo"); hl(me, r.memo); row.appendChild(me); }
        card.appendChild(row);
      });
      list.appendChild(card);
    }
  }
  var tmr = null;
  q.addEventListener("input", function () { clearTimeout(tmr); tmr = setTimeout(render, 150); });
  document.getElementById("clr").addEventListener("click", function () { q.value = ""; render(); q.focus(); });
  render();
})();
</script>
</body>
</html>
