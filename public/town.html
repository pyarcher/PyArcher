<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>울산 행정구역 명칭 변천사 — Kim Sang Yuk</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  :root { --text:#0B1220; --muted:#6B7290; --soft:#8A90A8; --border:#D7DCEE; --line:#E7EAF4; --blue:#2F5FE0; --purple:#6D4FE0; --hover:#EEF1FA; --th:#F3F5FC; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:linear-gradient(180deg,#EEF1FA 0%,#E7EBF7 100%); font-family:'Inter','Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:var(--text); }
  .wrap { max-width:1080px; margin:0 auto; padding:56px 32px 110px; }
  .back-link { display:inline-flex; align-items:center; gap:6px; text-decoration:none; color:#4A5170; font-size:13px; font-weight:600; margin-bottom:40px; transition:color .15s ease; }
  .back-link:hover { color:var(--blue); }
  .eyebrow { font-weight:700; font-size:13px; letter-spacing:.14em; margin:0 0 12px; }
  .eyebrow .blue { color:var(--blue); }
  h1 { font-size:36px; line-height:1.15; margin:0 0 6px; font-weight:800; letter-spacing:-0.02em; }
  .subtitle { font-size:15px; color:var(--muted); margin:0 0 6px; line-height:1.6; }
  .cite { font-size:13px; color:var(--soft); margin:0 0 24px; }
  .cite b { color:#4A5170; font-weight:700; }
  a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline:2px solid var(--blue); outline-offset:2px; border-radius:6px; }

  .searchbar { position:sticky; top:0; z-index:5; padding:10px 0 12px; background:linear-gradient(180deg,#EEF1FA 75%,rgba(238,241,250,0)); }
  .sbox { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--border); border-radius:14px; padding:4px 6px 4px 14px; box-shadow:0 8px 22px rgba(20,30,70,.08); }
  .sbox input { flex:1; min-width:0; border:0; outline:none; font:inherit; font-size:15px; padding:10px 0; background:transparent; color:var(--text); }
  .sbox .cnt { font-size:12.5px; font-weight:700; color:var(--purple); white-space:nowrap; }
  .sbox button { border:0; background:var(--hover); color:#3b4260; font:inherit; font-size:12.5px; font-weight:700; padding:8px 12px; border-radius:10px; cursor:pointer; }
  .sbox button:hover { background:#E2E7F6; }

  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 4px; }
  .tab { border:1px solid var(--border); background:#fff; color:#27407f; font:inherit; font-size:13px; font-weight:700; padding:7px 12px; border-radius:999px; cursor:pointer; transition:background .15s ease, border-color .15s ease; }
  .tab small { color:var(--soft); font-weight:600; margin-left:4px; }
  .tab:hover { background:var(--hover); }
  .tab[aria-pressed="true"] { background:var(--blue); border-color:var(--blue); color:#fff; }
  .tab[aria-pressed="true"] small { color:#dfe6ff; }
  .subtabs { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 0; padding-top:10px; border-top:1px dashed var(--border); }
  .subtabs .tab { font-size:12.5px; padding:6px 11px; }

  .sec-head { display:flex; align-items:baseline; gap:12px; margin:34px 0 10px; }
  .sec-name { font-weight:800; font-size:16px; color:var(--purple); letter-spacing:.02em; }
  .sec-line { flex:1; height:1px; background:var(--border); }
  .sec-cnt { font-size:12px; font-weight:700; color:var(--soft); }
  .card { background:#fff; border-radius:16px; box-shadow:0 12px 30px rgba(20,30,70,.08); padding:8px 20px 12px; margin:0 0 16px; }
  .card h3 { font-size:14.5px; margin:12px 0 6px; color:#27407f; }
  .it { display:grid; grid-template-columns:64px minmax(0,1fr); gap:2px 14px; padding:8px 2px; border-top:1px solid var(--line); font-size:13.5px; line-height:1.7; }
  .card h3 + .it { border-top:0; }
  .yr { font-weight:800; color:var(--blue); font-variant-numeric:tabular-nums; }
  .yr.none { color:var(--soft); font-weight:600; }
  .tx { white-space:pre-line; }
  .tx .pg { color:var(--soft); font-size:11.5px; }
  .prose details summary { cursor:pointer; font-size:13px; font-weight:700; color:var(--blue); padding:10px 0; list-style:none; }
  .prose details summary::-webkit-details-marker { display:none; }
  .prose p { margin:0 0 12px; font-size:13.5px; line-height:1.85; color:#2b3350; }
  .prose p .pg { color:var(--soft); font-size:11.5px; }
  mark { background:#FFE58A; color:inherit; border-radius:3px; padding:0 1px; }
  .empty { padding:40px 0; text-align:center; color:var(--muted); }
  .note { font-size:12.5px; color:var(--muted); line-height:1.7; margin:40px 0 0; }
  .floatnav { position:fixed; right:18px; bottom:18px; z-index:10; }
  .floatnav a { display:block; text-decoration:none; font-size:12px; font-weight:800; color:#fff; background:var(--blue); border-radius:999px; padding:9px 14px; box-shadow:0 8px 20px rgba(47,95,224,.35); }
  @media (max-width:760px) {
    .wrap { padding:36px 16px 100px; }
    h1 { font-size:28px; }
    .card { padding:6px 12px 10px; }
    .it { grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="wrap" id="top">
  <a class="back-link" href="/">&larr; KIM SANG YUK</a>
  <p class="eyebrow">ULSAN <span>&mdash;</span> <span class="blue">TOWN</span></p>
  <h1>울산 행정구역 명칭 변천사</h1>
  <p class="subtitle" id="sub">구·군과 읍·면·동, 마을 이름의 변천</p>
  <p class="cite">출처: <b>울산행정구역변천사(울산연구원)</b></p>

  <div class="searchbar">
    <div class="sbox">
      <input id="q" type="search" placeholder="지명·연도·왕대·구군 검색 (예: 부내면, 1914, 영조, 범서)" aria-label="행정구역 변천 검색" autocomplete="off" />
      <span class="cnt" id="cnt" aria-live="polite"></span>
      <button type="button" id="clr">지우기</button>
    </div>
  </div>

  <nav class="tabs" id="tabs" aria-label="구·군 선택"></nav>
  <nav class="subtabs" id="subtabs" aria-label="읍·면 선택"></nav>
  <div id="list"></div>

  <p class="note" id="srcnote"></p>
</div>
<div class="floatnav"><a href="#top">↑ 위로</a></div>

<script src="town-data.js"></script>
<script>
(function () {
  var D = window.TOWN;
  if (!D) { document.getElementById("list").textContent = "데이터 파일(town-data.js)을 불러오지 못했습니다."; return; }
  var G = D.groups, U = D.units, I = D.items;          // items: [unit, kind, year, head, text, page]
  var KIND = { m: "행정구역(명칭) 변천", v: "행정구역(마을) 변천", p: "해설" };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  var nItem = I.filter(function (x) { return x[1] !== "p"; }).length;
  document.getElementById("sub").textContent = "구·군과 읍·면·동, 마을 이름의 변천 · " + U.length + "개 단위 · 변천 기록 " + nItem.toLocaleString() + "건";
  document.getElementById("srcnote").textContent = "출처: " + D.source + ". 원서를 글자 인식(OCR)으로 읽어 옮겼으므로 일부 글자가 틀릴 수 있으며, 괄호 안 한자는 정확히 읽히지 않아 뺐습니다. 각 항목 끝의 쪽수로 원서를 확인해 주세요.";

  var HAY = I.map(function (x) { var u = U[x[0]]; return [G[u.g].name, u.name, KIND[x[1]], x[2] || "", x[3], x[4]].join(" ").toLowerCase(); });
  var cntU = U.map(function () { return 0; }), cntG = G.map(function () { return 0; });
  I.forEach(function (x) { if (x[1] !== "p") { cntU[x[0]]++; cntG[U[x[0]].g]++; } });

  var curG = 0, curU = -1;
  try { var sv = JSON.parse(localStorage.getItem("pyarcher-town-tab") || "null"); if (sv && sv.g < G.length) { curG = sv.g; curU = sv.u; } } catch (e) {}
  if (curU < 0 || !U[curU] || U[curU].g !== curG) curU = firstUnit(curG);
  function firstUnit(g) { for (var i = 0; i < U.length; i++) if (U[i].g === g) return i; return -1; }
  function save() { try { localStorage.setItem("pyarcher-town-tab", JSON.stringify({ g: curG, u: curU })); } catch (e) {} }

  var tabs = document.getElementById("tabs"), subtabs = document.getElementById("subtabs"), tabBtns = [];
  G.forEach(function (g, i) {
    var b = el("button", "tab"); b.type = "button"; b.appendChild(document.createTextNode(g.name));
    if (cntG[i]) b.appendChild(el("small", null, String(cntG[i])));
    b.addEventListener("click", function () { curG = i; curU = firstUnit(i); q.value = ""; save(); render(); });
    tabs.appendChild(b); tabBtns.push(b);
  });

  var TK = [];
  function hl(parent, text) {
    text = String(text == null ? "" : text);
    if (!TK.length || !text) { parent.appendChild(document.createTextNode(text)); return; }
    var low = text.toLowerCase(), pos = 0;
    while (pos < text.length) {
      var best = -1, len = 0;
      TK.forEach(function (t) { var k = low.indexOf(t, pos); if (k >= 0 && (best < 0 || k < best)) { best = k; len = t.length; } });
      if (best < 0) { parent.appendChild(document.createTextNode(text.slice(pos))); break; }
      if (best > pos) parent.appendChild(document.createTextNode(text.slice(pos, best)));
      parent.appendChild(el("mark", null, text.slice(best, best + len)));
      pos = best + len;
    }
  }

  function itemRow(x) {
    var r = el("div", "it");
    var y = el("span", "yr" + (x[2] ? "" : " none")); hl(y, x[2] ? x[2] + "년" : "—"); r.appendChild(y);
    var t = el("div", "tx");
    if (x[3]) { var h = el("b"); hl(h, x[3]); t.appendChild(h); t.appendChild(document.createTextNode(" ")); }
    hl(t, x[4]); t.appendChild(el("span", "pg", " · " + x[5] + "쪽")); r.appendChild(t);
    return r;
  }

  function drawUnit(ui, list, openProse) {
    var frag = document.createDocumentFragment(), u = U[ui];
    var hd = el("div", "sec-head");
    hd.appendChild(el("span", "sec-name", (G[u.g].name === u.name ? "" : G[u.g].name + " · ") + u.name));
    hd.appendChild(el("span", "sec-line"));
    hd.appendChild(el("span", "sec-cnt", "원서 " + u.p0 + "~" + u.p1 + "쪽"));
    frag.appendChild(hd);
    ["m", "v"].forEach(function (k) {
      var part = list.filter(function (x) { return x[1] === k; });
      if (!part.length) return;
      var c = el("section", "card"); c.appendChild(el("h3", null, KIND[k] + " · " + part.length + "건"));
      part.forEach(function (x) { c.appendChild(itemRow(x)); });
      frag.appendChild(c);
    });
    var pr = list.filter(function (x) { return x[1] === "p"; });
    if (pr.length) {
      var c2 = el("section", "card prose"), det = el("details");
      det.appendChild(el("summary", null, "해설 본문 보기 (" + pr.length + "단락)"));
      if (openProse) det.open = true;
      pr.forEach(function (x) { var p = el("p"); hl(p, x[4]); p.appendChild(el("span", "pg", " · " + x[5] + "쪽")); det.appendChild(p); });
      c2.appendChild(det); frag.appendChild(c2);
    }
    return frag;
  }

  var listEl = document.getElementById("list"), q = document.getElementById("q"), cnt = document.getElementById("cnt");
  function render() {
    TK = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    listEl.textContent = ""; subtabs.textContent = "";
    tabBtns.forEach(function (b, i) { b.setAttribute("aria-pressed", (!TK.length && i === curG) ? "true" : "false"); });
    if (!TK.length) {
      subtabs.hidden = false;
      U.forEach(function (u, ui) {
        if (u.g !== curG) return;
        var b = el("button", "tab"); b.type = "button"; b.appendChild(document.createTextNode(u.name));
        if (cntU[ui]) b.appendChild(el("small", null, String(cntU[ui])));
        b.setAttribute("aria-pressed", ui === curU ? "true" : "false");
        b.addEventListener("click", function () { curU = ui; save(); render(); });
        subtabs.appendChild(b);
      });
      if (subtabs.children.length < 2) subtabs.hidden = true;
      listEl.appendChild(drawUnit(curU, I.filter(function (x) { return x[0] === curU; }), false));
      cnt.textContent = "변천 기록 " + nItem.toLocaleString() + "건";
      return;
    }
    subtabs.hidden = true;
    var hits = [];
    I.forEach(function (x, i) { var h = HAY[i]; if (TK.every(function (t) { return h.indexOf(t) >= 0; })) hits.push(x); });
    cnt.textContent = "검색 결과 " + hits.length.toLocaleString() + "건";
    if (!hits.length) { listEl.appendChild(el("p", "empty", "찾는 내용이 없습니다.")); return; }
    var shown = hits.slice(0, 500);
    U.forEach(function (u, ui) {
      var part = shown.filter(function (x) { return x[0] === ui; });
      if (part.length) listEl.appendChild(drawUnit(ui, part, true));
    });
    if (hits.length > shown.length) listEl.appendChild(el("p", "empty", "결과가 많아 앞의 500건만 보여 줍니다. 검색어를 더 넣어 좁혀 보세요."));
  }
  var tmr = null;
  q.addEventListener("input", function () { clearTimeout(tmr); tmr = setTimeout(render, 160); });
  document.getElementById("clr").addEventListener("click", function () { q.value = ""; render(); q.focus(); });
  render();
})();
</script>
</body>
</html>
