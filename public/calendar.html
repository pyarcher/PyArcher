<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pyarcher’s Calendar — Kim Sang Yuk</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  :root {
    --text: #0B1220; --muted: #6B7290; --soft: #8A90A8; --border: #D7DCEE; --line: #E7EAF4;
    --blue: #2F5FE0; --purple: #6D4FE0; --red: #D64545; --teal: #168A7A; --amber: #A8670F;
    --hover: #EEF1FA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(180deg, #EEF1FA 0%, #E7EBF7 100%);
    font-family: 'Inter', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color: var(--text);
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 56px 32px 100px; }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    color: #4A5170; font-size: 13px; font-weight: 600; margin-bottom: 40px; transition: color .15s ease;
  }
  .back-link:hover { color: var(--blue); }
  .eyebrow { font-weight: 700; font-size: 13px; letter-spacing: .14em; margin: 0; }
  .eyebrow .blue { color: var(--blue); }
  h1 { font-size: 40px; line-height: 1.1; margin: 0 0 14px; font-weight: 800; letter-spacing: -0.02em; }
  .subtitle { font-size: 14px; color: var(--muted); margin: 0 0 8px; line-height: 1.6; }

  section { margin-top: 56px; }
  .sec-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
  .sec-name { font-weight: 800; font-size: 13px; color: var(--purple); letter-spacing: .1em; white-space: nowrap; }
  .sec-line { flex: 1; height: 1px; background: var(--border); }
  .sec-tools { display: flex; gap: 8px; }

  .card { background: #fff; border-radius: 16px; box-shadow: 0 12px 30px rgba(20,30,70,.10); padding: 22px 26px; }

  /* TODAY */
  .today-line { font-size: 22px; font-weight: 800; margin: 0 0 16px; letter-spacing: -0.01em; }
  .today-line .tri { color: var(--blue); margin-right: 6px; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
  .tile { background: #fff; border-radius: 14px; padding: 14px 16px; box-shadow: 0 8px 22px rgba(20,30,70,.08); }
  .tile .lab { font-size: 11px; font-weight: 700; color: var(--soft); letter-spacing: .04em; line-height: 1.4; }
  .tile .val { font-size: 13px; font-weight: 800; margin-top: 6px; }
  .tile .sub { font-size: 10px; color: var(--muted); margin-top: 2px; min-height: 14px; }
  .today-note { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.7; }

  /* nav + filters */
  .navbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .navgroup { display: flex; gap: 8px; align-items: center; }
  .btn {
    font: inherit; font-size: 13px; font-weight: 700; color: #4A5170; background: #fff;
    border: 1px solid var(--border); border-radius: 999px; padding: 8px 14px; cursor: pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .btn:hover { background: var(--hover); color: var(--blue); border-color: var(--blue); }
  .btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .btn.primary:hover { background: #2450c4; color: #fff; }
  .btn.small { padding: 5px 11px; font-size: 12px; }
  .btn.danger:hover { color: var(--red); border-color: var(--red); }
  .btn:focus-visible, .cell:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .monthlabel { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; min-width: 150px; text-align: center; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 0 0 14px; }
  .filters label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #4A5170; cursor: pointer; }
  .filters input { accent-color: var(--blue); width: 15px; height: 15px; margin: 0; }

  /* grid */
  .cal { background: #fff; border-radius: 16px; box-shadow: 0 20px 50px rgba(20,30,70,.14); overflow: hidden; }
  .dows, .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .dows div { text-align: center; font-size: 12px; font-weight: 800; letter-spacing: .08em; padding: 11px 0; color: #4A5170; border-bottom: 1px solid var(--border); background: #F7F8FD; }
  .dows div:first-child { color: var(--red); }
  .dows div:last-child { color: var(--blue); }
  .cell {
    font: inherit; text-align: left; color: inherit; background: #fff; border: 0;
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    min-height: 118px; padding: 7px 7px 6px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-width: 0;
  }
  .cell:nth-child(7n) { border-right: 0; }
  .cell:hover { background: var(--hover); }
  .cell.out { background: #FBFBFE; }
  .cell.out .num, .cell.out .lun { opacity: .45; }
  .cell.sel { box-shadow: inset 0 0 0 2px var(--blue); }
  .ctop { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
  .num { font-size: 14px; font-weight: 800; min-width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; }
  .num.sun, .num.off { color: var(--red); }
  .num.sat { color: var(--blue); }
  .num.today { background: var(--blue); color: #fff; }
  .lun { font-size: 10.5px; color: var(--soft); font-weight: 600; white-space: nowrap; }
  .chips { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .chip { font-size: 10.5px; font-weight: 700; line-height: 1.3; padding: 1.5px 5px; border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-hol { background: #FDECEC; color: #C03030; }
  .c-term { background: #E6F5F2; color: var(--teal); }
  .c-mem { background: #EEF1FA; color: #4A5170; }
  .c-folk { background: #F1EDFC; color: var(--purple); }
  .c-ul { background: #E8EEFD; color: var(--blue); }
  .c-mk { background: #FFF3DC; color: var(--amber); }
  .c-dd { background: #0B1220; color: #fff; }
  .dots { display: none; }
  .dot { width: 6px; height: 6px; border-radius: 50%; }
  .d-hol { background: var(--red); } .d-term { background: var(--teal); } .d-mem { background: #8A90A8; }
  .d-folk { background: var(--purple); } .d-ul { background: var(--blue); } .d-mk { background: #D79A2B; } .d-dd { background: #0B1220; }

  /* selected-day detail */
  .detail { margin-top: 16px; }
  .detail h3 { margin: 0 0 12px; font-size: 18px; font-weight: 800; }
  .drow { display: grid; grid-template-columns: 110px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.6; }
  .drow:first-of-type { border-top: 0; }
  .drow .k { font-weight: 700; color: var(--soft); font-size: 12px; letter-spacing: .06em; padding-top: 2px; }
  .drow .v .red { color: var(--red); font-weight: 700; }
  .drow .v .none { color: var(--soft); }

  /* D-DAY table */
  table.dd { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.dd th { text-align: left; font-size: 12px; letter-spacing: .08em; color: var(--soft); font-weight: 800; padding: 0 10px 10px; border-bottom: 1px solid var(--border); }
  table.dd td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.dd tr:last-child td { border-bottom: 0; }
  table.dd td.dday { font-weight: 800; color: var(--blue); white-space: nowrap; }
  table.dd tr.past td { color: var(--soft); }
  table.dd tr.past td.dday { color: var(--soft); }
  table.dd tr.today td.dday { color: var(--red); }
  table.dd td.date { white-space: nowrap; color: #4A5170; }
  table.dd input[type=text], table.dd input[type=date], .pw input {
    font: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; width: 100%; background: #fff; color: var(--text);
  }
  .editbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 10px 0 0; }
  .pw { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .pw input { width: 220px; }
  .msg { font-size: 12px; color: var(--red); font-weight: 600; }
  .msg.ok { color: var(--teal); }

  /* lists */
  .lrow { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 7px 0; font-size: 14px; line-height: 1.7; }
  .lrow .k { font-weight: 700; color: var(--purple); }
  .lrow .v .none { color: var(--soft); }
  .note { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13.5px; line-height: 1.85; color: #3A4260; }
  .note .t { font-weight: 700; color: var(--text); }
  .note a { color: var(--blue); text-decoration: none; word-break: break-all; }
  .note a:hover { text-decoration: underline; }
  .note ul { list-style: none; margin: 2px 0 0; padding: 0; }
  .note li { padding-left: 14px; text-indent: -14px; }
  .note li::before { content: "* "; color: var(--soft); }
  .note li.dash::before { content: "- "; }
  .note p { margin: 8px 0 0; }

  .hist a { color: var(--blue); text-decoration: none; }
  .hist a:hover { text-decoration: underline; }
  .hist .lbl { font-size: 15px; font-weight: 700; margin: 0 0 14px; }
  .hist .lbl:last-child { margin-bottom: 0; }
  .hist .lbl .tri { color: var(--blue); margin-right: 6px; }

  @media (max-width: 760px) {
    .wrap { padding: 36px 16px 80px; }
    h1 { font-size: 30px; }
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .cell { min-height: 84px; padding: 4px 2px; align-items: stretch; }
    .ctop { flex-direction: column; align-items: center; gap: 0; }
    .lun { font-size: 9px; }
    .chip { font-size: 9px; padding: 1px 3px; border-radius: 3px; white-space: normal; overflow: visible; word-break: keep-all; overflow-wrap: anywhere; line-height: 1.25; }
    .chips { gap: 2px; }
    .monthlabel { font-size: 19px; min-width: 0; flex: 1; }
    .navbar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .navbar .navgroup:nth-child(2) { order: -1; grid-column: 1 / -1; }
    .navgroup { justify-content: space-between; }
    .navbar .navgroup:nth-child(3) { justify-content: flex-end; }
    .btn { padding: 8px 10px; font-size: 12px; }
    .drow, .lrow { grid-template-columns: 82px 1fr; }
    .card { padding: 18px 16px; }
    table.dd th:nth-child(1), table.dd td:nth-child(1) { padding-left: 4px; }
    .today-line { font-size: 18px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="/">&larr; KIM SANG YUK</a>
  <p class="eyebrow">PYARCHER’S <span>&mdash;</span> <span class="blue">CALENDAR</span></p>

  <section id="s-today" style="margin-top:28px">
    <div class="sec-head"><span class="sec-name">♠ TODAY</span><span class="sec-line"></span></div>
    <div id="today"></div>
  </section>

  <section id="s-month">
    <div class="sec-head"><span class="sec-name">MONTHLY CALENDAR</span><span class="sec-line"></span></div>
    <div class="navbar">
      <div class="navgroup">
        <button class="btn" id="py" type="button">◀ 이전 해</button>
        <button class="btn" id="pm" type="button">◁ 이전 달</button>
      </div>
      <div class="navgroup" style="flex:1;justify-content:center">
        <span class="monthlabel" id="mlabel" aria-live="polite"></span>
        <button class="btn primary" id="tod" type="button">오늘</button>
      </div>
      <div class="navgroup">
        <button class="btn" id="nm" type="button">다음 달 ▷</button>
        <button class="btn" id="ny" type="button">다음 해 ▶</button>
      </div>
    </div>
    <div class="filters" id="filters"></div>
    <div class="cal">
      <div class="dows"><div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div></div>
      <div class="days" id="days"></div>
    </div>
  </section>

  <section id="s-dday">
    <div class="sec-head"><span class="sec-name">▷ D-DAY</span><span class="sec-line"></span>
      <div class="sec-tools"><button class="btn small" id="editbtn" type="button">편집</button></div>
    </div>
    <div class="card" id="dday"></div>
  </section>

  <section id="s-cele">
    <div class="sec-head"><span class="sec-name">◆ CELEBRATION DAY</span><span class="sec-line"></span></div>
    <div class="card" id="cele"></div>
  </section>

  <section id="s-ulsan">
    <div class="sec-head"><span class="sec-name">♣ DAYS OF ULSAN</span><span class="sec-line"></span></div>
    <div class="card" id="ulsan"></div>
  </section>

  <section id="s-market">
    <div class="sec-head"><span class="sec-name">♥ ULSAN MARKET DAY</span><span class="sec-line"></span></div>
    <div class="card" id="market"></div>
  </section>

  <section id="s-hist">
    <div class="sec-head"><span class="sec-name">▣ TODAY IN HISTORY</span><span class="sec-line"></span></div>
    <div class="card hist" id="hist"></div>
  </section>
</div>

<script src="calendar-data.js"></script>
<script>
/* =====================================================================
   설정 영역 — 여기만 고치면 됩니다
   ===================================================================== */

// D-DAY 공개 목록 (방문자에게 보이는 값). 날짜 형식: YYYY-MM-DD
const EVENTS = [
  { t: "중국 주석 선출",     d: "2028-03-05" },
  { t: "23대 총선",          d: "2028-04-12" },
  { t: "울산국제정원박람회", d: "2028-04-15" },
  { t: "LA올림픽",           d: "2028-07-14" },
  { t: "미국 대선",          d: "2028-11-07" },
  { t: "22대 대선",          d: "2030-03-27" },
  { t: "10회 지방선거",      d: "2030-06-12" }
];

// 편집 비밀번호의 SHA-256 해시. 비워 두면 처음 '편집'을 누를 때 이 브라우저에 비밀번호를 정합니다.
const ADMIN_HASH = "";

// 임시공휴일·선거일 등 (공휴일처럼 빨간색으로 표시). [날짜, 이름]
const EXTRA_HOLIDAYS = [
  ["2025-01-27", "임시공휴일"],
  ["2025-06-03", "제21대 대통령선거일"],
  ["2026-06-03", "제9회 전국동시지방선거일"],
  ["2028-04-12", "제23대 국회의원선거일"],
  ["2030-03-27", "제22대 대통령선거일"],
  ["2030-06-12", "제10회 전국동시지방선거일"]
];

// 각종 기념일 등에 관한 규정 등의 기념일. [월, 일, 이름]  /  규칙형: [월, "nth", 요일(0=일), 몇째, 이름]
const MEMORIALS = [
  [2,28,"2·28민주운동기념일"], [3,8,"3·8민주의거기념일"], [3,15,"3·15의거기념일"],
  [3,"nth",5,4,"서해수호의 날"],
  [4,3,"제주4·3 희생자 추념일"], [4,5,"식목일"], [4,11,"대한민국임시정부수립기념일"],
  [4,19,"4·19혁명기념일"], [4,20,"장애인의 날"], [4,21,"과학의 날"], [4,22,"새마을의 날"],
  [4,28,"충무공 이순신 탄신일"],
  [5,1,"노동절(근로자의 날)"], [5,8,"어버이날"], [5,10,"유권자의 날"], [5,15,"스승의 날"],
  [5,18,"5·18민주화운동기념일"], [5,20,"발명의 날"], [5,21,"부부의 날"],
  [5,"nth",1,3,"성년의 날"], [5,31,"바다의 날"],
  [6,10,"6·10민주항쟁기념일"], [6,25,"6·25전쟁일"],
  [8,14,"일본군 위안부 피해자 기림의 날"],
  [10,1,"국군의 날"], [10,2,"노인의 날"], [10,15,"체육의 날"], [10,21,"경찰의 날"],
  [10,25,"독도의 날"], [10,29,"지방자치의 날"],
  [11,3,"학생독립운동기념일"], [11,9,"소방의 날"], [11,11,"농업인의 날"], [11,17,"순국선열의 날"]
];

// 울산의 기념일 (양력). [월, 일, 이름]
const ULSAN_DAYS = [
  [2,26,"울산 수소산업의 날"], [3,22,"울산 화학의 날"], [4,2,"언양 만세운동"], [4,4,"병영 만세운동"],
  [4,8,"남창 만세운동"], [4,15,"울주군 군민의 날"], [4,25,"남구 고래의 날"], [5,15,"중구 구민의 날"],
  [5,12,"울산 자동차의 날"], [6,28,"울산 조선해양의 날"], [7,5,"동구 현대엔진 노조 결성일"],
  [7,15,"광역시 승격 기념일"], [7,15,"북구 구민의 날"], [10,1,"울산 시민의 날"], [10,19,"외솔 나신 날"]
];

/* =====================================================================
   기본 도구
   ===================================================================== */
const KST = "Asia/Seoul";
const pad = n => String(n).padStart(2, "0");
const key = (y, m, d) => y + "-" + pad(m) + "-" + pad(d);
const dowOf = (y, m, d) => new Date(Date.UTC(y, m - 1, d)).getUTCDay();
const dimOf = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
const DOW_KO = ["일", "월", "화", "수", "목", "금", "토"];
function addDays(y, m, d, n) { const t = new Date(Date.UTC(y, m - 1, d + n)); return [t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()]; }
function parseKey(k) { const [y, m, d] = k.split("-").map(Number); return { y, m, d }; }
function jdn(y, m, d) {
  const a = Math.floor((14 - m) / 12), y2 = y + 4800 - a, m2 = m + 12 * a - 3;
  return d + Math.floor((153 * m2 + 2) / 5) + 365 * y2 + Math.floor(y2 / 4) - Math.floor(y2 / 100) + Math.floor(y2 / 400) - 32045;
}
function daysBetween(a, b) { return Math.round((Date.UTC(b.y, b.m - 1, b.d) - Date.UTC(a.y, a.m - 1, a.d)) / 86400000); }
function nthDow(y, m, dow, n) { const first = dowOf(y, m, 1); return 1 + ((dow - first + 7) % 7) + (n - 1) * 7; }
function todayKST() {
  const s = new Intl.DateTimeFormat("en-CA", { timeZone: KST, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  const [y, m, d] = s.split("-").map(Number); return { y, m, d };
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function link(href, text) { const a = el("a", "", text || href); a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer"; return a; }

/* =====================================================================
   천문 계산 — 24절기(태양 황경), 간지
   ===================================================================== */
const STEM_K = "갑을병정무기경신임계", STEM_H = "甲乙丙丁戊己庚辛壬癸";
const BR_K = "자축인묘진사오미신유술해", BR_H = "子丑寅卯辰巳午未申酉戌亥";
const pillarK = i => STEM_K[i % 10] + BR_K[i % 12];
const pillarH = i => STEM_H[i % 10] + BR_H[i % 12];

function sunLon(jd) {

function parseDateInput(str) {                      // "2028. 3. 5." / "2028-3-5" / "2028 3 5" 모두 허용
  const m = /^\s*(\d{4})\D+(\d{1,2})\D+(\d{1,2})\D*$/.exec(str); if (!m) return null;

/* ---------- TODAY IN HISTORY ---------- */
const HIST = [
  ["한국천문연구원 음양력 변환", "https://astro.kasi.re.kr/kor/life/pageView/8"],
  ["한국고전종합DB 한중일 연호검색", "https://db.itkc.or.kr/extra/yonHoPop"],
  ["HANHUB 동양연표", "https://chronology.hanhub.click/?year=-140"],
  ["時間規範檢索(中韓日)", "https://authority.dila.edu.tw/time/"],
  ["兩千年中西曆轉換", "https://sinocal.sinica.edu.tw/"]
];
function renderHist() {
  const box = document.getElementById("hist"); box.textContent = "";
  for (const [t, u] of HIST) {
    const l = el("div", "lbl"); l.append(el("span", "tri", "▷"), link(u, t));
    box.append(l);
  }
}

/* ---------- 전체 ---------- */
function renderAll(full) {
  renderGrid(); renderDday(); renderCele(); renderUlsan(); renderMarket();
  if (full !== false) { renderToday(); renderHist(); }
}
function go(dy, dm) {
  let y = view.y + dy, m = view.m + dm;
  while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; }
  y = Math.min(2099, Math.max(1901, y));
  view.y = y; view.m = m;
  const dd = Math.min(sel.d, dimOf(y, m)); sel.y = y; sel.m = m; sel.d = dd;
  renderAll(false);
}
document.getElementById("py").addEventListener("click", () => go(-1, 0));
document.getElementById("pm").addEventListener("click", () => go(0, -1));
document.getElementById("nm").addEventListener("click", () => go(0, 1));
document.getElementById("ny").addEventListener("click", () => go(1, 0));
document.getElementById("tod").addEventListener("click", () => { const t = todayKST(); view.y = sel.y = t.y; view.m = sel.m = t.m; sel.d = t.d; renderAll(false); });

renderFilters();
renderAll(true);
setInterval(() => { const t = todayKST(); if (t.d !== T0.d || t.m !== T0.m) location.reload(); else renderToday(); }, 60000);
</script>
