<svg width="760" height="880" viewBox="0 0 380 440" xmlns="http://www.w3.org/2000/svg" role="img">
<title>오방색을 적용한 太和 중심 구조도</title>
<desc>중앙 太和는 황색, 북쪽 城鹽鐵은 흑색, 남쪽 車船化는 적색, 서쪽 巚津滄은 백색, 동쪽 鯨馬鶴은 청색으로 오방색을 부여한 다이어그램</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- spokes -->
<line x1="190" y1="216" x2="190" y2="186" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="190" y1="304" x2="190" y2="334" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="146" y1="260" x2="140" y2="260" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="234" y1="260" x2="240" y2="260" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- center: 太和 (황/중앙) -->
<circle cx="190" cy="260" r="44" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="190" y="246" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402" letter-spacing="3">太 和</text>
<text x="190" y="266" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">Sublime</text>
<text x="190" y="280" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">Harmony</text>

<!-- top: 城鹽鐵 (흑/북) -->
<rect x="110" y="122" width="160" height="64" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="190" y="142" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" letter-spacing="3">城 鹽 鐵</text>
<text x="190" y="160" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Legendary</text>
<text x="190" y="174" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">History</text>

<!-- bottom: 車船化 (적/남) -->
<rect x="110" y="334" width="160" height="64" rx="12" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="190" y="354" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#501313" letter-spacing="3">車 船 化</text>
<text x="190" y="372" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#791F1F">Intelligent</text>
<text x="190" y="386" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#791F1F">Technology</text>

<!-- left: 巚津滄 (백/서) -->
<rect x="40" y="228" width="100" height="64" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="90" y="248" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" letter-spacing="2">巚 津 滄</text>
<text x="90" y="266" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Beautiful</text>
<text x="90" y="280" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Nature</text>

<!-- right: 鯨馬鶴 (청/동) -->
<rect x="240" y="228" width="100" height="64" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="290" y="248" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53" letter-spacing="2">鯨 馬 鶴</text>
<text x="290" y="266" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Mystique</text>
<text x="290" y="280" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Spirit</text>
</svg>
